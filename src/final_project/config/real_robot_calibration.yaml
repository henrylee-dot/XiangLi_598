# 真机 Robotis MINI（KIMLAB 升级套件，U2D2 + 16 个 XL-320）的关节对照表。
# 舵机位置 = center + sign * 角度(rad) * 195.3786   （XL-320：0-1023，每单位 0.293°）
# 角度用的是仿真（robotis_mini.xml）里的关节角定义。
#
# 2026-10-31 校准（tools/dxl_joint_test.py，机器人悬空，每个关节转 ±10°~15° 目测方向）：
#   ID 1、2（肩）方向与仿真相反，其余 14 个一致。
#   center 暂用 512（舵机中位），零点还没有单独校准。

port: /dev/ttyUSB0
baudrate: 1000000
protocol: 2.0
units_per_rad: 195.3786

joints:
  r_shoulder_joint: {id: 1,  sign: -1, center: 512}
  l_shoulder_joint: {id: 2,  sign: -1, center: 512}
  r_biceps_joint:   {id: 3,  sign: 1,  center: 512}
  l_biceps_joint:   {id: 4,  sign: 1,  center: 512}
  r_elbow_joint:    {id: 5,  sign: 1,  center: 512}
  l_elbow_joint:    {id: 6,  sign: 1,  center: 512}
  r_hip_joint:      {id: 7,  sign: 1,  center: 512}
  l_hip_joint:      {id: 8,  sign: 1,  center: 512}
  r_thigh_joint:    {id: 9,  sign: 1,  center: 512}
  l_thigh_joint:    {id: 10, sign: 1,  center: 512}
  r_knee_joint:     {id: 11, sign: 1,  center: 512}
  l_knee_joint:     {id: 12, sign: 1,  center: 512}
  r_ankle_joint:    {id: 13, sign: 1,  center: 512}
  l_ankle_joint:    {id: 14, sign: 1,  center: 512}
  r_foot_joint:     {id: 15, sign: 1,  center: 512}
  l_foot_joint:     {id: 16, sign: 1,  center: 512}
